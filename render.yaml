services:
  - type: web
    name: jadwal-kuliah-umg
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:sYqUOOrhEUV75ciEfHkKK/YtZ9QZzc98D5CDED4uBS4=
      - key: APP_URL
        fromService:
          type: web
          name: jadwal-kuliah-umg
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: mysql
          name: db-jadwal
          property: host
      - key: DB_PORT
        fromService:
          type: mysql
          name: db-jadwal
          property: port
      - key: DB_DATABASE
        fromService:
          type: mysql
          name: db-jadwal
          property: database
      - key: DB_USERNAME
        fromService:
          type: mysql
          name: db-jadwal
          property: user
      - key: DB_PASSWORD
        fromService:
          type: mysql
          name: db-jadwal
          property: password
      - key: SESSION_DRIVER
        value: cookie

databases:
  - name: db-jadwal
    type: mysql
    version: "8.0"
